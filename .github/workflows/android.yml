name: Android APK Build Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java JDK 17 Kurulumu (Güncel v5)
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Resmi Gradle Ortamını Kur (Güncel v4)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # Kaldırılan arguments parametresi yerine komutu doğrudan çalıştıran güncel yöntem
    - name: Projeyi ve APK'yı Derle (Assemble Debug)
      run: gradle assembleDebug

    - name: Üretilen APK Dosyasını Otomatik Bul ve Yükle
      uses: actions/upload-artifact@v4
      with:
        name: WhatsAppCleaner-Debug-APK
        path: "**/build/outputs/apk/**/*.apk"

