name: Android APK Build Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: ZIP Arşivini Çıkart
      run: |
        if [ -f WhatsAppCleaner_Project.zip ]; then
          echo "ZIP dosyası bulundu, ayıklanıyor..."
          unzip -q WhatsAppCleaner_Project.zip -d ./
          # Eğer dosyalar alt klasöre çıktıysa ana dizine taşıyalım
          if [ -d "WhatsAppCleaner_Project" ]; then
            mv WhatsAppCleaner_Project/* .
          fi
        else
          echo "ZIP dosyası ana dizinde bulunamadı!"
          exit 1
        fi

    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Gradle Çalıştırma Yetkisi Ver
      run: chmod +x gradlew

    - name: Projeyi ve APK'yı Derle (Assemble Debug)
      run: ./gradlew assembleDebug

    - name: Üretilen APK Dosyasını Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: WhatsAppCleaner-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
